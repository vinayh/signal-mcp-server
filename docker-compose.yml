services:
  signal-mcp:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=3000
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      # If your Signal config.json doesn't contain the key directly,
      # you may need to provide it via SIGNAL_KEY
      # - SIGNAL_KEY=${SIGNAL_KEY}
    volumes:
      # Mount the Signal Desktop data directory (read-only for safety)
      # Adjust the source path based on your OS:
      #
      # macOS:
      - ~/Library/Application Support/Signal:/signal-data:ro
      #
      # Linux:
      # - ~/.config/Signal:/signal-data:ro
      #
      # Linux (Flatpak):
      # - ~/.var/app/org.signal.Signal/config/Signal:/signal-data:ro
      #
      # Windows (WSL2):
      # - /mnt/c/Users/YOUR_USER/AppData/Roaming/Signal:/signal-data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
